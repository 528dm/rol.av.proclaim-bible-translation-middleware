# Builds the Windows and Mac apps on GitHub's machines.
#
# - Publishing a release builds all three and attaches them to that release.
# - Actions tab > "Build apps" > "Run workflow" builds them on demand. Enter a
#   release tag (e.g. v1.0.0) to attach them to an existing release, or leave it
#   empty to just build; the files then appear under "Artifacts" on the run page.

name: Build apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the builds to (leave empty to just build)"
        required: false
        default: ""

permissions:
  contents: write   # needed to attach files to a release

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false   # one platform failing doesn't stop the others
      matrix:
        include:
          - label: Windows
            os: windows-latest
            asset: Proclaim-Bible-Passages-Windows.zip
          - label: Mac (Apple Silicon)
            os: macos-latest
            asset: Proclaim-Bible-Passages-Mac-AppleSilicon.zip
          - label: Mac (Intel)
            os: macos-15-intel
            asset: Proclaim-Bible-Passages-Mac-Intel.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # On Windows, compile PyInstaller's starter program (the "bootloader") from
      # source instead of using the prebuilt one. Antivirus programs have learned
      # to associate the prebuilt one with malware that also uses PyInstaller, so
      # a freshly compiled one is less likely to cause false alarms.
      - name: Install PyInstaller (Windows, bootloader built from source)
        if: runner.os == 'Windows'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --no-binary pyinstaller pyinstaller

      - name: Install PyInstaller (Mac)
        if: runner.os == 'macOS'
        run: python -m pip install pyinstaller

      - name: Build
        run: python build.py

      # zip the app folder (the exe plus the _internal folder it needs)
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath "${{ matrix.asset }}"

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/*.app "${{ matrix.asset }}"

      - name: Save as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" --clobber
